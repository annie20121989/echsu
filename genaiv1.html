<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GenAI 應用素養・增強大型語言模型認證 1000 題庫</title>
  <style>
    /* 100% 純內嵌 CSS，零外部依賴，專為 iPad / iPhone / OneDrive / GitHub Pages 設計 */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --rose-50: #fdf7f8;
      --rose-100: #fbf0f2;
      --rose-200: #f6dce0;
      --rose-300: #f1abb1; /* 核心基調粉 */
      --rose-400: #e58f98;
      --rose-500: #d5707a;
      --rose-600: #ba535e;
      --rose-deep: #381a1e; /* 深褐石灰文字 */
      --rose-muted: #7e4d55;
      --border-color: rgba(241, 171, 177, 0.55);
      --glass-bg: rgba(255, 255, 255, 0.96);
      --shadow-sm: 0 4px 14px rgba(56, 26, 30, 0.05);
      --shadow-card: 0 8px 24px rgba(241, 171, 177, 0.25);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--rose-50);
      color: var(--rose-deep);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 15% 15%, rgba(241, 171, 177, 0.22) 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(246, 220, 224, 0.35) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, #fdf7f8 0%, #faedf0 100%);
    }
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 12px 14px calc(70px + env(safe-area-inset-bottom, 12px));
    }
    @media (min-width: 768px) {
      .app-container {
        padding: 20px 24px 40px;
      }
    }
    header {
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--rose-300), var(--rose-500));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }
    .logo-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--rose-deep);
      line-height: 1.2;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--rose-muted);
    }
    .stats-pill {
      background: var(--rose-100);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--rose-deep);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-reset-header {
      background: #fff;
      border: 1px solid var(--border-color);
      color: var(--rose-600);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab-btn {
      background: var(--rose-100);
      border: 1px solid transparent;
      color: var(--rose-deep);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .nav-tab-btn.active {
      background: var(--rose-500);
      color: #fff;
      box-shadow: 0 2px 8px rgba(213, 112, 122, 0.35);
    }
    .card-panel {
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow-card);
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .card-panel {
        padding: 24px;
      }
    }
    .chapter-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0 10px;
    }
    .chapter-scroll::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--rose-100);
      border: 1px solid var(--border-color);
      color: var(--rose-deep);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip-btn.active {
      background: var(--rose-600);
      color: #fff;
      border-color: var(--rose-600);
    }
    .q-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--rose-200);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .tag-chapter {
      background: var(--rose-100);
      color: var(--rose-deep);
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tag-num {
      font-size: 12px;
      font-weight: 800;
      color: var(--rose-deep);
    }
    .tag-num span {
      color: var(--rose-600);
      font-size: 15px;
    }
    .scenario-box {
      background: rgba(246, 220, 224, 0.45);
      border-left: 4px solid var(--rose-300);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--rose-deep);
      line-height: 1.55;
    }
    .scenario-title {
      font-weight: 800;
      color: var(--rose-600);
      margin-bottom: 3px;
      font-size: 11px;
    }
    .question-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--rose-deep);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    @media (min-width: 768px) {
      .question-title {
        font-size: 16px;
      }
    }
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
    }
    .option-btn {
      width: 100%;
      min-height: 48px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--rose-deep);
      cursor: pointer;
      text-align: left;
      line-height: 1.45;
      transition: background 0.15s, border 0.15s;
    }
    .option-btn:active {
      transform: scale(0.99);
    }
    .option-letter {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--rose-100);
      color: var(--rose-deep);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .option-btn.correct {
      background: #eefbf3 !important;
      border: 1.5px solid #28a745 !important;
      color: #125424 !important;
      font-weight: 700;
    }
    .option-btn.correct .option-letter {
      background: #28a745 !important;
      color: #fff !important;
      border-color: #28a745 !important;
    }
    .option-btn.wrong {
      background: #fff0f1 !important;
      border: 1.5px solid #dc3545 !important;
      color: #841621 !important;
      text-decoration: line-through;
    }
    .option-btn.wrong .option-letter {
      background: #dc3545 !important;
      color: #fff !important;
      border-color: #dc3545 !important;
    }
    .option-btn.dimmed {
      opacity: 0.55;
    }
    .explanation-card {
      background: #fff;
      border: 1px solid var(--rose-200);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: var(--shadow-sm);
    }
    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--rose-100);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .exp-correct-label {
      font-size: 12px;
      font-weight: 800;
      color: #125424;
    }
    .exp-body {
      font-size: 12px;
      color: var(--rose-deep);
      line-height: 1.6;
    }
    .exp-ref {
      margin-top: 8px;
      font-size: 11px;
      color: var(--rose-muted);
    }
    .action-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--rose-200);
      padding-top: 12px;
      margin-top: 12px;
      gap: 8px;
    }
    .btn-act {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: var(--rose-100);
      border-color: var(--border-color);
      color: var(--rose-deep);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--rose-300), var(--rose-500));
      color: #fff;
      box-shadow: 0 4px 12px rgba(213, 112, 122, 0.3);
    }
    .exam-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .exam-stat-box {
      background: var(--rose-100);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }
    .exam-stat-val {
      font-
